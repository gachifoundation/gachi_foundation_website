# One-click deploy config for Render (https://render.com).
# Push this repo to GitHub, then on Render: New + → Blueprint → pick the repo.
services:
  - type: web
    name: gachi-foundation
    runtime: python
    plan: free            # upgrade to "starter" ($7/mo) to avoid idle sleep
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn gachi.wsgi"
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,gachifoundation.org,www.gachifoundation.org"
      - key: PYTHON_VERSION
        value: "3.12.4"
      # ---- Contact form email (Gmail SMTP) ----
      # NOTE: Render blocks outbound SMTP ports 25/465/587 on FREE web services.
      # The contact form will only send mail on a paid instance type (Starter+).
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: "gachifoundation@gmail.com"
      - key: DEFAULT_FROM_EMAIL
        value: "gachifoundation@gmail.com"
      - key: CONTACT_EMAIL
        value: "gachifoundation@gmail.com"
      # Secret: Render prompts for this at deploy time, it is never stored in git.
      - key: EMAIL_HOST_PASSWORD
        sync: false
